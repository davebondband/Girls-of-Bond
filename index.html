<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Girls of Bond - davebondband</title>

  <!-- Include Plyr CSS -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      box-sizing: border-box;
    }

    /* Clickable Main Title */
    h1.album-title {
      font-size: 1.6rem;
      margin: 0 0 20px 0;
      text-align: center;
    }

    h1.album-title a {
      color: #ffffff;
      text-decoration: none;
      transition: color 0.2s;
    }

    h1.album-title a:hover {
      color: #007aff;
      text-decoration: underline;
    }

    /* Horizontal Row Card Container */
    .player-card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 12px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      margin-bottom: 12px;
      box-sizing: border-box;
      
      /* Flexbox Side-by-Side Row Alignment */
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 14px;
    }

    /* Compact Left Thumbnail Image */
    .album-art {
      width: 90px;
      height: 90px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* Right-side Content Container */
    .card-content {
      flex: 1;
      min-width: 0; /* Ensures inner elements scale inside flex container */
    }

    h2 {
      font-size: 1.05rem;
      margin: 0 0 2px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    p.artist {
      color: #aaa;
      margin: 0 0 8px 0;
      font-size: 0.8rem;
    }

    /* Plyr Customizations for Compact Heights */
    :root {
      --plyr-color-main: #007aff;
      --plyr-control-spacing: 6px;
      --plyr-font-size-base: 12px;
      --plyr-control-icon-size: 15px;
    }

    .plyr {
      border-radius: 6px;
      margin-bottom: 8px;
    }

    /* Button Group Layout */
    .button-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .download-btn {
      flex: 1;
      background-color: #007aff;
      color: #ffffff;
      text-decoration: none;
      padding: 6px 0;
      border-radius: 16px;
      font-weight: bold;
      font-size: 0.8rem;
      text-align: center;
      transition: background 0.2s;
    }

    .download-btn:hover {
      background-color: #0056b3;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.2s, background-color 0.2s;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      transform: scale(1.08);
    }

    .icon-btn svg {
      width: 15px;
      height: 15px;
      fill: #ffffff;
    }

    .facebook-icon {
      background-color: #1877F2;
    }

    .facebook-icon:hover {
      background-color: #145dbf;
    }

    .youtube-icon {
      background-color: #FF0000;
    }

    .youtube-icon:hover {
      background-color: #cc0000;
    }
  </style>
</head>
<body>

  <h1 class="album-title">
    <a href="https://www.facebook.com/reel/3267104106810327" target="_blank" rel="noopener noreferrer">Girls of Bond</a>
  </h1>

  <!-- Track 1 Horizontal Card -->
  <div class="player-card">
    <img src="Angel-Cover.jpg" alt="Angel With One Wing Artwork" class="album-art">
    <div class="card-content">
      <h2>Angel With One Wing</h2>
      <p class="artist">davebondband (Athena Mix)</p>

      <audio class="player" controls>
        <source src="Angel%20with%20one%20wing%20Athena%20Mix.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>

      <div class="button-group">
        <a href="Angel%20with%20one%20wing%20Athena%20Mix.mp3" download class="download-btn">Download</a>
        <a href="https://www.facebook.com/reel/3267104106810327" target="_blank" rel="noopener noreferrer" class="icon-btn facebook-icon" aria-label="Watch on Facebook">
          <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        </a>
      </div>
    </div>
  </div>

  <!-- Track 2 Horizontal Card -->
  <div class="player-card">
    <img src="Scandal-Cover.jpg" alt="Easy Street Artwork" class="album-art">
    <div class="card-content">
      <h2>Easy Street</h2>
      <p class="artist">davebondband</p>

      <audio class="player" controls>
        <source src="Easy-Street.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>

      <div class="button-group">
        <a href="Easy-Street.mp3" download class="download-btn">Download</a>
        <a href="https://youtu.be/xVtYVT0nY5Q" target="_blank" rel="noopener noreferrer" class="icon-btn youtube-icon" aria-label="Watch on YouTube">
          <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        </a>
      </div>
    </div>
  </div>

  <!-- Include Plyr JS & Autoplay Script -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    const players = Array.from(document.querySelectorAll('.player')).map(p => new Plyr(p, {
      controls: ['play', 'progress', 'current-time', 'mute', 'volume']
    }));

    players.forEach((player, index) => {
      player.on('ended', () => {
        if (index + 1 < players.length) {
          const nextPlayer = players[index + 1];
          nextPlayer.play();
          
          nextPlayer.elements.container.scrollIntoView({ 
            behavior: 'smooth', 
            block: 'center' 
          });
        }
      });
    });
  </script>

</body>
</html>
