    body {

    /* Clickable Main Title Link */

      margin: 0 0 20px 0;
      text-align: center;
    }

      color: #ffffff;

    }

    h1.album-title a:hover {

      text-decoration: underline;
    }

    /* Compact Player Card */
    .player-card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 16px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      margin-bottom: 16px;
      box-sizing: border-box;
    }

    .album-art {
      width: 140px;
      height: 140px;
      border-radius: 8px;
      object-fit: cover;
      display: block;
      margin: 0 auto 12px auto;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    h2 {
      font-size: 1.1rem;
      margin: 0 0 4px 0;
      text-align: center;
    }

    p.artist {
      color: #aaa;
      margin: 0 0 12px 0;
      font-size: 0.85rem;
      text-align: center;
    }

    :root {
      --plyr-color-main: #007aff;
    }

    .plyr {
      border-radius: 6px;
      margin-bottom: 12px;
    }

    /* Button Group Layout */
    .button-group {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }

    /* Main Download Button */
    .download-btn {
      flex: 1;
      background-color: #007aff;
      color: #ffffff;
      text-decoration: none;
      padding: 8px 0;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      text-align: center;
      box-sizing: border-box;
      transition: background 0.2s;
    }

    .download-btn:hover {
      background-color: #0056b3;
    }

    /* Circular Social Media Icon Buttons */
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.2s, background-color 0.2s;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      transform: scale(1.08);
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }

  <!-- Include Plyr JS & Autoplay Script -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    // Initialize Plyr on all audio players
    const players = Array.from(document.querySelectorAll('.player')).map(p => new Plyr(p, {
      controls: ['play', 'progress', 'current-time', 'mute', 'volume']
    }));

    // Continuous Autoplay: Plays the next track automatically when current track ends
    players.forEach((player, index) => {
      player.on('ended', () => {
        if (index + 1 < players.length) {
          const nextPlayer = players[index + 1];
          nextPlayer.play();
          
          // Smoothly scroll the next card into view on mobile
          nextPlayer.elements.container.scrollIntoView({ 
            behavior: 'smooth', 
            block: 'center' 
          });
        }
      });
    });
  </script>
