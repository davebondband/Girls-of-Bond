<!-- Include Plyr JS -->
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script>
  // Initialize Plyr on all players on the page
  const players = Array.from(document.querySelectorAll('.player')).map(p => new Plyr(p, {
    controls: ['play', 'progress', 'current-time', 'mute', 'volume']
  }));

  // Add event listener to each player to trigger the next track when finished
  players.forEach((player, index) => {
    player.on('ended', () => {
      // Check if there is a next player in the list
      if (index + 1 < players.length) {
        const nextPlayer = players[index + 1];
        nextPlayer.play(); // Automatically start playing the next track
        
        // Scroll the next card smoothly into view on mobile
        nextPlayer.elements.container.scrollIntoView({ 
          behavior: 'smooth', 
          block: 'center' 
        });
      }
    });
  });
</script>
