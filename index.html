<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girls of Bond - davebondband</title>
    <!-- Include Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 80px 16px 24px 16px; /* Added top padding so content clears the top sticky bar */
            box-sizing: border-box;
        }

        /* Clickable Main Title Link */
        h1.album-title {
            font-size: 1.6rem;
            margin: 24px 0 20px 0;
            text-align: center;
        }
        h1.album-title a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.2s, text-decoration 0.2s;
        }
        h1.album-title a:hover {
            color: #007aff;
            text-decoration: underline;
        }

        /* Compact Player Card */
        .player-card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 16px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            margin-bottom: 16px;
            box-sizing: border-box;
        }
        .album-art {
            width: 140px;
            height: 140px;
            border-radius: 8px;
            object-fit: cover;
            display: block;
            margin: 0 auto 12px auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        h2 {
            font-size: 1.1rem;
            margin: 0 0 4px 0;
            text-align: center;
        }
        p.artist {
            color: #aaa;
            margin: 0 0 12px 0;
            font-size: 0.85rem;
            text-align: center;
        }
        :root {
            --plyr-color-main: #007aff;
        }
        .plyr {
            border-radius: 6px;
            margin-bottom: 12px;
        }

        /* Button Group Layout */
        .button-group {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }

        /* Main Download Button */
        .download-btn {
            flex: 1;
            background-color: #007aff;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 0;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            text-align: center;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .download-btn:hover {
            background-color: #0056b3;
        }

        /* Circular Social Media Icon Buttons */
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
            flex-shrink: 0;
        }
        .icon-btn:hover {
            transform: scale(1.08);
        }
        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
        }

        /* Brand Colors */
        .facebook-icon {
            background-color: #1877F2;
        }
        .facebook-icon:hover {
            background-color: #145dbf;
        }
        .youtube-icon {
            background-color: #FF0000;
        }
        .youtube-icon:hover {
            background-color: #cc0000;
        }
    </style>
</head>
